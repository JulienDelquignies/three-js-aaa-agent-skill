<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>threejs-aaa-starter</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 600 14px/1.4 system-ui, sans-serif; color: #cfd3dc; letter-spacing: 0.04em;
        background: #0a0a0c; transition: opacity 0.4s; z-index: 10;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">INITIALIZING RENDERER…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
