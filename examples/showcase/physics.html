<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physique (Rapier) — Three.js AAA</title>
    <style>
      :root { color-scheme: dark; } * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      #app { position: fixed; inset: 0; } canvas { display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center;
        font: 600 14px/1.4 system-ui, sans-serif; color: #cfd3dc; letter-spacing: .04em; background: #0a0a0c; transition: opacity .4s; z-index: 10; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .hud { position: fixed; z-index: 20; font: 500 13px/1.35 system-ui, sans-serif; color: #e8ebf2; }
      .back { top: 16px; left: 16px; padding: 8px 14px; border-radius: 999px; text-decoration: none;
        background: rgba(20,22,28,.72); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(8px); }
      .back:hover { background: rgba(40,44,54,.9); }
      .help { right: 16px; bottom: 16px; text-align: right; padding: 12px 15px; border-radius: 12px;
        background: rgba(16,18,24,.66); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(8px); line-height: 1.7; }
      .help b { color: #fff; } kbd { font: 600 11px system-ui; background: #262c38; border: 1px solid #3a4354;
        border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; margin: 0 1px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a class="hud back" href="./index.html">← Galerie</a>
    <div class="hud help">
      <b>Physique — Rapier</b><br>
      <kbd>WASD</kbd>/<kbd>ZQSD</kbd>/<kbd>↑↓←→</kbd> courir · <b>souris</b> regarder · <b>molette</b> zoom<br>
      <kbd>Shift</kbd> sprint · <kbd>J</kbd> saut · <kbd>Espace</kbd> frapper le ballon · <kbd>E</kbd> pousser doux<br>
      Un <b style="color:#e57373">adversaire IA</b> te dispute le ballon. Pousse les caisses, monte la rampe. 🎮📱 OK.
    </div>
    <div id="loading">CHARGEMENT DU MOTEUR PHYSIQUE…</div>
        <script>
      // the HELP panel must be CLOSABLE — on a phone it swallowed the whole screen (user report):
      // X folds it into a small ? button, and it starts folded on touch/small screens
      (() => {
        const h = document.querySelector('.help'); if (!h) return;
        h.style.maxWidth = 'min(480px, 88vw)'; h.style.maxHeight = '56vh'; h.style.overflow = 'auto';
        const x = document.createElement('button');
        x.textContent = '\u2715';
        x.style.cssText = 'position:absolute;top:6px;' + (getComputedStyle(h).textAlign === 'right' ? 'left:8px' : 'right:8px') +
          ';width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font:700 12px system-ui';
        h.appendChild(x);
        const b = document.createElement('button');
        b.textContent = '\u2753';
        const topStack = document.getElementById('laptopbtn');           // stack under the HUD buttons if they exist
        b.style.cssText = 'position:fixed;z-index:31;padding:9px 12px;border-radius:999px;font-size:15px;background:rgba(20,22,28,.72);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;display:none;backdrop-filter:blur(8px);' +
          (topStack ? 'right:16px;top:226px' : 'right:16px;bottom:16px');
        document.body.appendChild(b);
        const set = (open) => { h.style.display = open ? '' : 'none'; b.style.display = open ? 'none' : 'block'; };
        x.addEventListener('click', () => set(false));
        b.addEventListener('click', () => set(true));
        if (matchMedia('(max-width: 900px)').matches || 'ontouchstart' in window || navigator.maxTouchPoints > 0) set(false);
      })();
    </script>
    <script type="module" src="/src/entry-physics.js"></script>
  </body>
</html>
