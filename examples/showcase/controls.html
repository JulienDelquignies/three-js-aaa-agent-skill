<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contrôles — Three.js AAA</title>
    <style>
      :root { color-scheme: dark; } * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      #app { position: fixed; inset: 0; } canvas { display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center;
        font: 600 14px/1.4 system-ui, sans-serif; color: #cfd3dc; letter-spacing: .04em; background: #0a0a0c; transition: opacity .4s; z-index: 10; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .hud { position: fixed; z-index: 20; font: 500 13px/1.35 system-ui, sans-serif; color: #e8ebf2; }
      .back { top: 16px; left: 16px; padding: 8px 14px; border-radius: 999px; text-decoration: none;
        background: rgba(20,22,28,.72); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(8px); }
      .back:hover { background: rgba(40,44,54,.9); }
      #score { top: 14px; left: 50%; transform: translateX(-50%); font: 800 22px system-ui; padding: 6px 16px;
        border-radius: 12px; background: rgba(10,12,16,.6); border: 1px solid rgba(255,255,255,.12); }
      .help { right: 16px; bottom: 16px; text-align: right; padding: 12px 15px; border-radius: 12px;
        background: rgba(16,18,24,.66); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(8px); line-height: 1.7; }
      .help b { color: #fff; } kbd { font: 600 11px system-ui; background: #262c38; border: 1px solid #3a4354;
        border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; margin: 0 1px; }
      #goal-flash { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; pointer-events: none;
        opacity: 0; transition: opacity .18s; font: 900 clamp(40px,10vw,120px) system-ui; letter-spacing: .05em;
        color: #fff; text-shadow: 0 4px 30px rgba(90,150,255,.9); background: radial-gradient(closest-side, rgba(40,90,200,.25), transparent 70%); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a class="hud back" href="./index.html">← Galerie</a>
    <div class="hud" id="score">⚽ 0</div>
    <div class="hud help">
      <b>Contrôles</b><br>
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>ZQSD</kbd> / <kbd>↑↓←→</kbd> — courir (relatif caméra)<br>
      <b>souris</b> regarder &nbsp;·&nbsp; <b>molette</b> zoom<br>
      <kbd>Shift</kbd> sprint &nbsp;·&nbsp; <kbd>J</kbd> saut &nbsp;·&nbsp; <kbd>Espace</kbd> tir &nbsp;·&nbsp; <kbd>E</kbd> centre<br>
      🎮 manette &amp; 📱 tactile (joystick + boutons) OK — vise le but.
    </div>
    <div id="goal-flash">BUT !</div>
    <div id="loading">INITIALISATION DU RENDU…</div>
    <script type="module" src="/src/entry-controls.js"></script>
  </body>
</html>
