<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match 11c11 — notre cerveau, leurs corps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; } * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      #app { position: fixed; inset: 0; } canvas { display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 14px system-ui; color: #cfd3dc; background: #0a0a0c; z-index: 10; transition: opacity .4s; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #gpfHud { position: fixed; left: 12px; bottom: 12px; z-index: 20; font: 500 12px/1.4 system-ui; color: #e8ebf2; padding: 8px 12px;
        border-radius: 10px; background: rgba(12,16,24,.72); border: 1px solid rgba(255,255,255,.12); max-width: calc(100vw - 24px); }
      .titre { position: fixed; right: 12px; top: 12px; z-index: 20; font: 600 12px/1.35 system-ui; color: #e8ebf2; padding: 8px 12px; border-radius: 10px;
        background: rgba(12,16,24,.6); border: 1px solid rgba(255,255,255,.1); max-width: 60vw; text-align: right; }
      .titre span { color: #9aa2b1; font-weight: 400; }
      /* téléphone : le titre sans la liste des paramètres, des encarts plus petits — le terrain d'abord */
      @media (max-width: 900px) { .titre { display: none; } }
      @media (max-width: 640px) { #gpfHud { font-size: 11px; padding: 6px 10px; left: 8px; bottom: 8px; max-width: calc(100vw - 16px); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="titre hud">Notre cerveau, les corps de Gameplay Football, nos humains<br><span>lot L2 (le cerveau) et L5 (l’image) · ⚙ pour les réglages et les raccourcis</span></div>
    <div id="gpfHud">chargement du moteur…</div>
    <div id="loading">COUP D’ENVOI…</div>
    <script type="module" src="./src/entry-gpf-match.js"></script>
  </body>
</html>
